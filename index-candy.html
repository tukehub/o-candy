<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6f4">
<meta name="mobile-web-app-capable" content="yes">
<title>Candy Orik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: two phone screens — a bottom-up level map winding through Albanian towns, and the 8x8 board with HUD + Orik's commentary. Light, high-contrast look: flag red on white with a faint qilim pattern; tiles use six clearly different bright colours. */
:root{
  --bg:#fff6f4; --panel:#ffffff; --line:#f1d6d3; --board:#fdf0ee; --check:#f7e1de; --kuq:#d6202f; --gold:#e5a412; --fg:#2a1316; --muted:#7a5a5d; --lock:#e9dddb; --dim:#e3cfcc;
  --display:'Bagel Fat One','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cell:44px;
  color-scheme:light;
}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(214,32,47,.06) 22px 24px),repeating-linear-gradient(-45deg,transparent 0 22px,rgba(214,32,47,.06) 22px 24px);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.screen{height:100%;max-width:500px;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box}
h1{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0;line-height:1}
h1 b{color:var(--kuq);font-weight:400}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:800;letter-spacing:.03em;font-size:1.05rem;background:var(--kuq);color:#fff;box-shadow:inset 0 -4px 0 #0003}
button.ghost{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 2px var(--line);font-weight:600;padding:10px 14px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:active{transform:translateY(2px)}

/* map */
.maphead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px}
.totstars{font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);padding:6px 12px;border-radius:99px;font-size:.95rem}
.totstars::first-letter{color:var(--gold)}
.mapscroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-bottom:16px;-webkit-overflow-scrolling:touch}
.map{position:relative}
.band{position:absolute;left:0;right:0;border-radius:22px;overflow:hidden}
.band h3{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:14px 16px 2px;line-height:1}
.band p{margin:0 16px;font-size:.85rem;color:var(--muted)}
.map svg{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;padding:0;border-radius:50%;font-family:var(--display);font-weight:400;font-size:1.4rem;
  background:var(--kuq);color:#fff;box-shadow:inset 0 -5px 0 #0003,0 0 0 4px #fff,0 5px 12px #0003}
.node.locked{background:var(--lock);color:#a08c8a;box-shadow:inset 0 -5px 0 #0001,0 0 0 4px #fff;cursor:default}
.node.current{background:var(--gold);color:#3a2300;animation:bob 1.6s ease-in-out infinite;z-index:3}
@keyframes bob{50%{transform:translate(-50%,-58%)}}
.node .st{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:var(--body);font-size:.85rem;letter-spacing:1px;white-space:nowrap;color:var(--dim)}
.node .st i{font-style:normal;color:var(--gold)}
.marker{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;font-family:var(--body);font-size:.68rem;font-weight:800;
  padding:3px 8px;border-radius:99px;letter-spacing:.08em;white-space:nowrap}

/* game */
#gameScreen{gap:10px;padding-inline:16px;padding-block:10px 14px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gtop .lvl{font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right}
.hud{display:grid;grid-template-columns:auto 1fr;gap:10px}
.stat{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat small{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat strong{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat strong.low{color:var(--kuq)}
.bar{position:relative;height:10px;border-radius:99px;background:var(--check);margin-top:6px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--kuq),var(--gold));transition:width .4s}
.bar b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:1rem;color:var(--dim);text-shadow:0 0 2px #fff,0 0 2px #fff}
.bar b.on{color:var(--gold)}
.goals{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.chip .g{width:28px;height:28px;display:grid;place-items:center;font-size:1.15rem;border-radius:8px}
.chip.done{color:#1f8a46;box-shadow:inset 0 0 0 2px #9fdcb3}
.ico-rug{background:repeating-linear-gradient(45deg,#d6202f 0 4px,transparent 4px 8px),#ffb3b8;box-shadow:inset 0 0 0 2px var(--kuq)}
.ico-bunker{background:linear-gradient(#bdb8b1,#7c7770);border-radius:50% 50% 12% 12%/70% 70% 12% 12%!important}
.boardwrap{display:flex;justify-content:center}
#board{position:relative;width:calc(var(--cell)*8);height:calc(var(--cell)*8);border-radius:16px;background:var(--board);
  box-shadow:0 0 0 4px var(--kuq),0 10px 24px #6a1a2030;touch-action:none;overflow:hidden}
#board::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%),linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%);
  background-size:calc(var(--cell)*2) calc(var(--cell)*2);background-position:0 0,var(--cell) var(--cell)}
.rug{position:absolute;width:var(--cell);height:var(--cell);transition:opacity .35s,transform .35s}
.rug::before{content:"";position:absolute;inset:2%;border-radius:6px;
  background:repeating-linear-gradient(45deg,#d6202f88 0 4px,transparent 4px 9px),repeating-linear-gradient(-45deg,#d6202f88 0 4px,transparent 4px 9px),#ffc2c6}
.rug.r2::before{background:repeating-linear-gradient(45deg,#d6202fcc 0 4px,transparent 4px 9px),repeating-linear-gradient(-45deg,#d6202fcc 0 4px,transparent 4px 9px),#ff8a92;box-shadow:inset 0 0 0 3px var(--gold)}
.rug.r0{opacity:0;transform:scale(.6)}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform 300ms cubic-bezier(.3,1.2,.5,1);will-change:transform}
.gem{position:absolute;inset:8%;border-radius:26%;display:grid;place-items:center;font-size:calc(var(--cell)*.6);line-height:1;
  box-shadow:inset 0 -4px 0 #0002,inset 0 0 0 2px #ffffff80,0 2px 3px #0002;transition:transform .2s,opacity .2s}
.gem span{pointer-events:none}
.t0 .gem{background:#ff4f58}.t1 .gem{background:#ffa53a}.t2 .gem{background:#43b0ff}
.t3 .gem{background:#9b6cf5}.t4 .gem{background:#3fcf74}.t5 .gem{background:#ff7cc6}
.sel .gem{transform:scale(1.14);box-shadow:0 0 0 4px var(--fg),0 6px 12px #0004}
.hint .gem{animation:wig .6s ease-in-out 3}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.pop .gem{transform:scale(0) rotate(40deg);opacity:0}
.born .gem{animation:born .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes born{from{transform:scale(0)}}
.sp-row .gem::after,.sp-col .gem::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.sp-row .gem::after{background:repeating-linear-gradient(0deg,#ffffffcc 0 3px,transparent 3px 8px)}
.sp-col .gem::after{background:repeating-linear-gradient(90deg,#ffffffcc 0 3px,transparent 3px 8px)}
.sp-boom .gem{animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 0 3px var(--gold),0 0 14px var(--gold)}
@keyframes pulse{50%{transform:scale(.9)}}
.sp-bomb .gem{background:radial-gradient(circle at 40% 35%,#4a4a4a,#111 70%);box-shadow:0 0 0 3px var(--kuq),0 0 14px var(--kuq)}
.sp-bomb .gem span{color:#ff5a63;font-family:var(--display);font-size:1em;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bunker .gem{inset:14% 6% 6%;border-radius:50% 50% 12% 12%/72% 72% 12% 12%;background:linear-gradient(#c9c4bd,#8a857e);box-shadow:inset 0 -4px 0 #0003,0 3px 4px #0003}
.bunker .gem::before{content:"";position:absolute;left:24%;right:24%;top:46%;height:13%;border-radius:3px;background:#2b2826}
.bunker.hp2 .gem{background:linear-gradient(#8f8a83,#55514b);box-shadow:inset 0 0 0 3px #ffffff40,inset 0 -4px 0 #0004,0 3px 4px #0004}
.hit .gem{animation:hit .3s}
@keyframes hit{30%{transform:translateX(-3px) scale(.95)}70%{transform:translateX(3px)}}
.beam{position:absolute;background:linear-gradient(90deg,transparent,var(--gold),transparent);pointer-events:none;animation:fade .4s ease-out forwards;z-index:5}
.beam.v{background:linear-gradient(0deg,transparent,var(--gold),transparent)}
@keyframes fade{from{opacity:1}to{opacity:0}}
.float{position:absolute;font-family:var(--display);color:var(--kuq);font-size:1.4rem;pointer-events:none;z-index:6;text-shadow:0 0 3px #fff,0 0 3px #fff,0 2px 0 #fff;transform:translate(-50%,-50%);animation:float .9s ease-out forwards}
@keyframes float{to{transform:translate(-50%,-160%);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.orik{display:flex;gap:10px;align-items:center;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);border-radius:14px;padding:10px 12px;min-height:3.2em}
.orik .face{flex:none;width:38px;height:38px;border-radius:50%;background:var(--kuq);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;box-shadow:inset 0 -3px 0 #0003}
.orik p{margin:0;font-size:.98rem;line-height:1.35;min-width:0}

/* overlay cards */
.overlay{position:fixed;inset:0;background:#3a141a8c;display:grid;place-items:center;z-index:20;padding:16px;overflow-y:auto}
.card{background:var(--panel);border-radius:20px;padding:24px 22px;max-width:340px;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 0 0 4px var(--kuq),0 20px 50px #0004;display:flex;flex-direction:column;gap:12px}
.card .ep{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.card h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;line-height:1.05;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.45;font-size:1rem}
.card .big{font-size:3rem;line-height:1}
.card .goals{justify-content:center}
.card .tip{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left;font-size:.92rem;color:var(--fg);display:flex;gap:10px;align-items:center}
.card .tip .g{flex:none;width:30px;height:30px;border-radius:8px}
.bigstars{font-size:2.8rem;letter-spacing:6px;color:var(--dim);line-height:1}
.bigstars i{font-style:normal;color:var(--gold);display:inline-block;animation:born .5s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars i:nth-child(2){animation-delay:.25s}.bigstars i:nth-child(3){animation-delay:.5s}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;text-align:left;font-size:.9rem;color:var(--fg);align-items:center}
.legend .m{width:28px;height:28px;border-radius:8px}
.legend .m.r{background:repeating-linear-gradient(90deg,#ffffffcc 0 3px,transparent 3px 7px),#43b0ff}
.legend .m.b{background:#ffa53a;box-shadow:0 0 0 2px var(--gold),0 0 8px var(--gold)}
.legend .m.x{background:radial-gradient(circle,#4a4a4a,#111);box-shadow:0 0 0 2px var(--kuq)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section class="screen" id="mapScreen">
  <div class="maphead"><h1>Candy <b>Orik</b></h1><span class="totstars" id="totStars">★ 0 / 90</span></div>
  <div class="mapscroll" id="mapScroll"><div class="map" id="map"></div></div>
</section>

<section class="screen" id="gameScreen" hidden>
  <div class="gtop">
    <button class="ghost" id="backBtn">‹ Harta</button>
    <span class="lvl" id="lvlLabel">Niveli 1</span>
  </div>
  <div class="hud">
    <div class="stat"><small>Lëvizje</small><strong id="moves">20</strong></div>
    <div class="stat"><small>Lekë</small><strong id="score">0</strong><div class="bar"><i id="bar"></i><b id="s2">★</b><b id="s3" style="left:calc(100% - 8px)">★</b></div></div>
  </div>
  <div class="goals" id="goals"></div>
  <div class="boardwrap"><div id="board" aria-label="Fusha e lojës"></div></div>
  <div class="orik"><div class="face">O</div><p id="quip">Rrëshqit një pllakë për ta ndërruar.</p></div>
</section>

<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>

<script>
(()=>{
const N=8,D4=[[1,0],[-1,0],[0,1],[0,-1]];
const TYPES=[
  {e:'🦅',verb:'Shpëto',name:'shqiponja',one:'shqiponjë'},
  {e:'🫒',verb:'Mblidh',name:'ullinj',one:'ulli'},
  {e:'☕',verb:'Pi',name:'kafe',one:'kafe'},
  {e:'🥧',verb:'Ha',name:'byrekë',one:'byrek'},
  {e:'🍅',verb:'Grij',name:'domate',one:'domate'},
  {e:'🪙',verb:'Kurse',name:'lekë',one:'lek'},
];
const EPISODES=[
  {name:'Tirana',desc:'Trafik, kafe dhe mendime të forta.',tint:'#ffe1de'},
  {name:'Shkodër',desc:'Biçikleta kudo. Kujdes këmbët.',tint:'#eee3fb'},
  {name:'Berat',desc:'Një mijë dritare, të gjitha të gjykojnë.',tint:'#ffefcf'},
  {name:'Gjirokastër',desc:'Qytet guri. Bunkerë guri. Nivele zemërgur.',tint:'#e9ebef'},
  {name:'Sarandë',desc:'Episodi i plazhit. Mos prit të pushosh.',tint:'#dcf0fb'},
  {name:'Theth',desc:'Male, pa sinjal, pa mëshirë.',tint:'#ddf3e2'},
];
const RUG={center:(r,c)=>r>=2&&r<=5&&c>=2&&c<=5,cross:(r,c)=>r===3||r===4||c===3||c===4,bottom:r=>r>=5,top:r=>r<=2,
  border:(r,c)=>r===0||r===7||c===0||c===7,checker:(r,c)=>(r+c)%2===0,X:(r,c)=>r===c||r+c===7,
  diamond:(r,c)=>Math.abs(r-3.5)+Math.abs(c-3.5)<=3,full:()=>true};
const BUNK={corners:(r,c)=>r>=6&&(c<=1||c>=6),middle:(r,c)=>r===4&&c>=1&&c<=6,pillars:(r,c)=>(c===2||c===5)&&r>=5,
  ring:(r,c)=>r>=2&&r<=5&&c>=2&&c<=5&&!(r>=3&&r<=4&&c>=3&&c<=4),
  scatter:(r,c)=>[[2,1],[2,6],[4,3],[4,4],[6,0],[6,7],[7,3],[7,4]].some(p=>p[0]===r&&p[1]===c),
  wall:(r,c)=>r===3&&c%2===1,steps:(r,c)=>r>=4&&(c===r-4||c===11-r)};
// [moves, tile kinds, goals, rug pattern, bunker pattern]   R: = double rugs, B: = double bunkers
const LV=[
  [20,5,'c0:10'],[20,5,'c3:15'],[22,5,'r','center'],[22,5,'c1:15 c2:15'],[24,5,'r','cross'],
  [20,5,'b',0,'corners'],[22,6,'c0:18'],[24,6,'r','bottom'],[22,6,'b c5:15',0,'middle'],[24,6,'r','border'],
  [22,6,'c4:22 b',0,'pillars'],[24,6,'r','R:center'],[24,6,'b',0,'ring'],[22,6,'r c0:15','checker'],[22,6,'c1:22 c3:22'],
  [24,6,'b',0,'B:pillars'],[24,6,'r','X'],[22,6,'b c2:22',0,'scatter'],[26,6,'r','R:diamond'],[24,6,'b r','top','B:wall'],
  [22,6,'c0:28'],[32,6,'r','full'],[22,6,'b c5:22',0,'steps'],[26,6,'r','R:cross'],[24,6,'c0:22 c3:22 c4:22'],
  [26,6,'b r','bottom','B:scatter'],[30,6,'r','R:border'],[24,6,'c0:30 b',0,'B:corners'],[28,6,'r b','full','middle'],[28,6,'c0:35 r b','R:center','pillars'],
];
const TOTAL=LV.length;
function levelDef(i){
  let [moves,types,g,rugS,bunkS]=LV[i];
  const rug=rugS?{fn:RUG[rugS.replace('R:','')],mult:rugS.startsWith('R:')?2:1}:null;
  const bunk=bunkS?{fn:BUNK[bunkS.replace('B:','')],hp:bunkS.startsWith('B:')?2:1}:null;
  const goals=g.split(' ').map(s=>s[0]==='c'?{kind:'collect',t:+s[1],n:+s.split(':')[1]}:{kind:s==='r'?'rug':'bunker'});
  moves+=(rug?5:0)+(bunk?5:0);
  return{i,moves,types,goals,rug,bunk,ep:Math.floor(i/5),s2:moves*150,s3:moves*250};
}
const COMBO=['','','Dy! Dy rresht.','Tre! Oriku pak i impresionuar.','Katër! Dyshimisht i zoti.','Pesë! Kush të mësoi?','Mjaft, tani po mburresh.'];
const LOSE=['Mbaruan lëvizjet. Shqiponja u njoftua.','Loja mbaroi. Edhe byreku është i zhgënjyer.','S\'ka më lëvizje. Oriku do bëjë sikur s\'pa gjë.','Humbje. Diku, një gjyshe psherëtin.'];
const WIN=['U kalua. Oriku bën sikur e priste.','Niveli mbaroi. Shqiponja të përshëndet me të dyja kokat.','Fitore. Pi një kafe. E meritove, mezi.','Gati. Do ta marrin vesh të gjithë kushërinjtë.'];
const IDLE=['Kur të kesh kohë.','Pllakat nuk lëvizin vetë.','Oriku u plak duke pritur.','Të mendosh lejohet. Kaq shumë, shqetëson.'];
const BUNKQ=['Një bunker më pak. Mbetën vetëm rreth 170 mijë në vend.','Bunkeri u shemb. Vitet \'70 janë të tërbuar.','Betoni u mund nga ullinjtë. Historia është e çuditshme.','Edhe një bunker iku. Lajmëroni ministrinë e turizmit.'];
const RUGQ=['Qilimi u pastrua. Gjyshja miraton, në heshtje.','Pluhuri u shkund. Alergjitë u anuluan.','Qilimi pa njollë. Hiqni këpucët, ju lutem.'];

const $=id=>document.getElementById(id);
const boardEl=$('board');
let board=[],rug=[],rugEls=[],cell=44,uid=0,busy=false,sel=null,def=null,score=0,moves=0,goals=[],hintT=null,over=false,playing=false;

const key=(r,c)=>r*N+c, rc=k=>[Math.floor(k/N),k%N];
const inb=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
const at=k=>{const[r,c]=rc(k);return board[r][c]};
const isGem=t=>!!t&&t.kind==='gem';
const typeAt=(r,c)=>board[r][c]?board[r][c].type:-2;
const sleep=ms=>new Promise(res=>setTimeout(res,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=()=>Math.floor(Math.random()*def.types);

/* progress */
function loadProg(){try{const p=JSON.parse(localStorage.getItem('orikMatch.stars')||'[]');if(Array.isArray(p))return p}catch(e){}return[]}
function saveProg(p){try{localStorage.setItem('orikMatch.stars',JSON.stringify(p))}catch(e){}}
let prog=loadProg();
const unlocked=()=>{let u=0;while(u<TOTAL&&(prog[u]||0)>0)u++;return u};

/* tiles */
function newTile(type,sp){return{id:++uid,kind:'gem',type,sp:sp||null,el:null}}
function newBunker(hp){return{id:++uid,kind:'bunker',type:-3,hp,el:null}}
function makeEl(t){const el=document.createElement('div');el.innerHTML='<div class="gem"><span></span></div>';t.el=el;paint(t);boardEl.appendChild(el);return el}
function paint(t){
  if(t.kind==='bunker'){t.el.className='tile bunker hp'+t.hp;return}
  t.el.className='tile'+(t.type>=0?' t'+t.type:'')+(t.sp?' sp-'+t.sp:'');
  t.el.querySelector('span').textContent=t.sp==='bomb'?'✦':TYPES[t.type].e;
}
function place(t,r,c){t.el.style.transform=`translate(${c*cell}px,${r*cell}px)`}
function layout(){if(board.length!==N)return;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];if(t&&t.el)place(t,r,c)}}
function noAnim(fn){boardEl.querySelectorAll('.tile').forEach(e=>e.style.transition='none');fn();boardEl.offsetHeight;boardEl.querySelectorAll('.tile').forEach(e=>e.style.transition='')}

function size(){
  const scr=$('gameScreen');if(scr.hidden)return;
  const w=Math.min(scr.clientWidth-32,460);
  let others=0;['.gtop','.hud','#goals','.orik'].forEach(q=>{others+=scr.querySelector(q).offsetHeight});
  const h=scr.clientHeight-24-others-40-14;
  cell=Math.max(32,Math.floor(Math.min(w,Math.max(h,256))/N));
  document.documentElement.style.setProperty('--cell',cell+'px');
  noAnim(layout);
}
/* matching */
function findRuns(){
  const runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const t=typeAt(r,c);let e=c+1;if(t>=0)while(e<N&&typeAt(r,e)===t)e++;
    if(t>=0&&e-c>=3){const cells=[];for(let x=c;x<e;x++)cells.push(key(r,x));runs.push({dir:'h',type:t,cells})}c=e}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const t=typeAt(r,c);let e=r+1;if(t>=0)while(e<N&&typeAt(e,c)===t)e++;
    if(t>=0&&e-r>=3){const cells=[];for(let y=r;y<e;y++)cells.push(key(y,c));runs.push({dir:'v',type:t,cells})}r=e}}
  return runs;
}
function swapCells(a,b){const[ar,ac]=rc(a),[br,bc]=rc(b);const t=board[ar][ac];board[ar][ac]=board[br][bc];board[br][bc]=t}
function findMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(!inb(r2,c2))continue;
    const A=board[r][c],B=board[r2][c2];if(!isGem(A)||!isGem(B))continue;
    const a=key(r,c),b=key(r2,c2);
    if(A.sp==='bomb'||B.sp==='bomb'||(A.sp&&B.sp))return[a,b];
    swapCells(a,b);const ok=findRuns().length>0;swapCells(a,b);if(ok)return[a,b];
  }
  return null;
}
function gemKeys(){const out=[];for(let k=0;k<N*N;k++)if(isGem(at(k)))out.push(k);return out}
function mostCommon(){const cnt=new Array(6).fill(0);gemKeys().forEach(k=>{const t=at(k);if(t.type>=0)cnt[t.type]++});return cnt.indexOf(Math.max(...cnt))}

/* board setup */
function fillBoard(){
  boardEl.querySelectorAll('.tile,.rug').forEach(e=>e.remove());
  let tries=0;
  do{
    board=[];
    for(let r=0;r<N;r++){board.push([]);for(let c=0;c<N;c++){
      if(def.bunk&&def.bunk.fn(r,c)){board[r].push(newBunker(def.bunk.hp));continue}
      let t,g=0;do{t=rnd()}while(g++<30&&((c>=2&&typeAt(r,c-1)===t&&typeAt(r,c-2)===t)||(r>=2&&typeAt(r-1,c)===t&&typeAt(r-2,c)===t)));
      board[r].push(newTile(t))}}
  }while((findRuns().length||!findMove())&&tries++<200);
  rug=[];rugEls=[];
  for(let r=0;r<N;r++){rug.push([]);rugEls.push([]);for(let c=0;c<N;c++){
    const v=def.rug&&def.rug.fn(r,c)&&!(def.bunk&&def.bunk.fn(r,c))?def.rug.mult:0;rug[r].push(v);
    const d=document.createElement('div');d.className='rug r'+v;d.style.left=`calc(var(--cell)*${c})`;d.style.top=`calc(var(--cell)*${r})`;boardEl.appendChild(d);rugEls[r].push(d)}}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];makeEl(t);t.el.style.transition='none';place(t,r-N-1,c)}
  boardEl.offsetHeight;
  boardEl.querySelectorAll('.tile').forEach(e=>e.style.transition='');
  requestAnimationFrame(()=>requestAnimationFrame(layout));
}
const rugsLeft=()=>rug.flat().filter(v=>v>0).length;
const bunkersLeft=()=>board.flat().filter(t=>t&&t.kind==='bunker').length;

/* effects */
function beam(r,c,dir){
  const b=document.createElement('div');b.className='beam'+(dir==='v'?' v':'');
  if(dir==='h')Object.assign(b.style,{left:0,right:0,top:(r*cell+cell*.35)+'px',height:(cell*.3)+'px'});
  else Object.assign(b.style,{top:0,bottom:0,left:(c*cell+cell*.35)+'px',width:(cell*.3)+'px'});
  boardEl.appendChild(b);setTimeout(()=>b.remove(),400);
}
function floatText(txt,r,c){
  const f=document.createElement('div');f.className='float';f.textContent=txt;
  f.style.left=(c*cell+cell/2)+'px';f.style.top=(r*cell+cell/2)+'px';
  boardEl.appendChild(f);setTimeout(()=>f.remove(),950);
}

/* clearing */
async function blast(start,creates,combo,all){
  const seen=new Set(start),q=[...start],fired=new Set();
  if(all)for(let k=0;k<N*N;k++)if(at(k))seen.add(k);
  while(q.length){
    const k=q.pop(),t=at(k);if(!isGem(t)||!t.sp||fired.has(t.id))continue;fired.add(t.id);
    const[r,c]=rc(k),add=[];
    if(t.sp==='row'){for(let x=0;x<N;x++)add.push([r,x]);beam(r,c,'h')}
    else if(t.sp==='col'){for(let y=0;y<N;y++)add.push([y,c]);beam(r,c,'v')}
    else if(t.sp==='boom'){const d=t.rad||1;for(let y=r-d;y<=r+d;y++)for(let x=c-d;x<=c+d;x++)add.push([y,x])}
    else if(t.sp==='cross3'){for(let d=-1;d<=1;d++){for(let x=0;x<N;x++)add.push([r+d,x]);for(let y=0;y<N;y++)add.push([y,c+d]);if(inb(r+d,0))beam(r+d,c,'h');if(inb(0,c+d))beam(r,c+d,'v')}}
    else if(t.sp==='bomb'){const tt=t.bombType??mostCommon();for(let y=0;y<N;y++)for(let x=0;x<N;x++){const o=board[y][x];if(isGem(o)&&o.type===tt)add.push([y,x])}}
    add.forEach(([y,x])=>{if(!inb(y,x))return;const k2=key(y,x);if(!seen.has(k2)&&board[y][x]){seen.add(k2);q.push(k2)}});
  }
  const gems=[],hits=new Set();
  seen.forEach(k=>{const t=at(k);if(!t)return;if(t.kind==='bunker')hits.add(k);else gems.push(k)});
  gems.forEach(k=>{const[r,c]=rc(k);D4.forEach(([dr,dc])=>{const y=r+dr,x=c+dc;if(inb(y,x)&&board[y][x]&&board[y][x].kind==='bunker')hits.add(key(y,x))})});
  if(!gems.length&&!hits.size)return;
  let sr=0,sc=0,rugCleared=0,broken=0;
  const dead=[...gems];
  gems.forEach(k=>{const t=at(k),[r,c]=rc(k);sr+=r;sc+=c;
    goals.forEach(g=>{if(g.kind==='collect'&&t.type===g.t&&g.left>0)g.left--});
    if(rug[r][c]>0){rug[r][c]--;rugEls[r][c].className='rug r'+rug[r][c];if(!rug[r][c])rugCleared++}});
  hits.forEach(k=>{const t=at(k);t.hp--;if(t.hp<=0){dead.push(k);broken++}else{paint(t);t.el.classList.add('hit')}});
  goals.forEach(g=>{if(g.kind==='rug')g.left=rugsLeft();if(g.kind==='bunker')g.left=bunkersLeft()-broken});
  const n=Math.max(1,gems.length),pts=gems.length*20*combo+fired.size*100+broken*150+rugCleared*40;
  score+=pts;floatText('+'+pts,sr/n,sc/n);hud();
  if(broken&&Math.random()<.6)say(pick(BUNKQ));else if(rugCleared>=3&&Math.random()<.4)say(pick(RUGQ));
  dead.forEach(k=>at(k).el.classList.add('pop'));
  await sleep(220);
  dead.forEach(k=>{const[r,c]=rc(k);board[r][c].el.remove();board[r][c]=null});
  goals.forEach(g=>{if(g.kind==='bunker')g.left=bunkersLeft()});
  creates.forEach(cr=>{const[r,c]=rc(cr.k);if(board[r][c])return;const t=newTile(cr.type,cr.sp);board[r][c]=t;makeEl(t);t.el.style.transition='none';place(t,r,c);t.el.classList.add('born')});
  boardEl.offsetHeight;boardEl.querySelectorAll('.tile').forEach(e=>e.style.transition='');
  hud();
  await gravity();
}

async function gravity(){
  const spawned=new Array(N).fill(0),fresh=[];
  let changed=true,guard=0;
  while(changed&&guard++<400){
    changed=false;
    for(let r=N-2;r>=0;r--)for(let c=0;c<N;c++){if(!board[r+1][c]&&isGem(board[r][c])){board[r+1][c]=board[r][c];board[r][c]=null;changed=true}}
    for(let c=0;c<N;c++)if(!board[0][c]){const t=newTile(rnd());spawned[c]++;board[0][c]=t;makeEl(t);t.el.style.transition='none';place(t,-spawned[c],c);fresh.push(t);changed=true}
    if(changed)continue;
    outer:for(let r=N-2;r>=0;r--)for(let c=0;c<N;c++){
      if(board[r+1][c]||isGem(board[r][c]))continue;
      for(const dc of(Math.random()<.5?[-1,1]:[1,-1])){const x=c+dc;if(x>=0&&x<N&&isGem(board[r][x])&&board[r+1][x]){board[r+1][c]=board[r][x];board[r][x]=null;changed=true;break outer}}
    }
  }
  boardEl.offsetHeight;
  fresh.forEach(t=>t.el.style.transition='');
  layout();
  await sleep(330);
}

function buildClear(runs,a,b){
  const clear=new Set(),creates=[],hm=new Map(),vm=new Map(),used=new Set();
  runs.forEach((run,i)=>run.cells.forEach(k=>{clear.add(k);(run.dir==='h'?hm:vm).set(k,i)}));
  for(const[k,hi]of hm){if(!vm.has(k))continue;const vi=vm.get(k);if(used.has(hi)||used.has(vi))continue;used.add(hi);used.add(vi);
    const big=runs[hi].cells.length>=5||runs[vi].cells.length>=5;creates.push({k,type:big?-1:runs[hi].type,sp:big?'bomb':'boom'})}
  runs.forEach((run,i)=>{if(used.has(i))return;const L=run.cells.length;if(L<4)return;
    const pk=run.cells.includes(a)?a:run.cells.includes(b)?b:run.cells[Math.floor(L/2)];
    creates.push(L>=5?{k:pk,type:-1,sp:'bomb'}:{k:pk,type:run.type,sp:run.dir==='h'?'col':'row'})});
  const ks=new Set();return{clear,creates:creates.filter(c=>!ks.has(c.k)&&ks.add(c.k))};
}
async function cascade(a,b,combo){
  let runs,guard=0;
  while((runs=findRuns()).length&&guard++<50){
    const{clear,creates}=buildClear(runs,a,b);
    if(combo>=2)say(COMBO[Math.min(combo,COMBO.length-1)]);
    await blast(clear,creates,combo,false);combo++;a=b=null;
  }
}

/* turns */
async function trySwap(a,b){
  if(busy||over)return;
  const A0=at(a),B0=at(b);if(!isGem(A0)||!isGem(B0))return;
  busy=true;clearSel();stopHint();
  swapCells(a,b);layout();await sleep(190);
  const A=at(a),B=at(b);
  if(A.sp==='bomb'||B.sp==='bomb'){
    moves--;hud();
    if(A.sp==='bomb'&&B.sp==='bomb'){say('Dy bomba-shqiponjë. Zgjodhe dhunën.');await blast(new Set([a,b]),[],3,true)}
    else{
      const bk=A.sp==='bomb'?a:b,bomb=at(bk),other=A.sp==='bomb'?B:A,ok=A.sp==='bomb'?b:a;bomb.bombType=other.type;
      if(other.sp){
        const ks=gemKeys().filter(k=>at(k).type===other.type);
        ks.forEach(k=>{const t=at(k);t.sp=other.sp==='boom'?'boom':(Math.random()<.5?'row':'col');paint(t);t.el.classList.add('born')});
        say('Çdo '+TYPES[other.type].one+' u bë armë. Oriku u fsheh.');
        await sleep(450);await blast(new Set([...ks,bk,ok]),[],2,false);
      }else{say('Asnjë '+TYPES[other.type].one+' s\'mbeti. Iku, si koha jote e lirë.');await blast(new Set([bk]),[],1,false)}
    }
    await cascade(null,null,2);
  }else if(A.sp&&B.sp){
    moves--;hud();
    if(A.sp==='boom'&&B.sp==='boom'){A.rad=2;B.rad=2;say('Shpërthim i dyfishtë. Po telefonojnë fqinjët.')}
    else if(A.sp==='boom'||B.sp==='boom'){B.sp='cross3';A.sp=null;say('Rreze të trefishta. Shumë diskrete.')}
    else{A.sp='row';B.sp='col';say('Zjarr kryq. Shumë dramatike.')}
    await blast(new Set([a,b]),[],2,false);await cascade(null,null,2);
  }else if(!findRuns().length){
    swapCells(a,b);layout();boardEl.classList.add('shake');setTimeout(()=>boardEl.classList.remove('shake'),300);
    await sleep(200);busy=false;startHint();return;
  }else{moves--;hud();await cascade(a,b,1)}
  await endTurn();
}
const goalsDone=()=>goals.every(g=>g.left<=0);
async function endTurn(){
  if(goalsDone()){
    over=true;await rakiRush();
    const stars=1+(score>=def.s2)+(score>=def.s3);
    prog[def.i]=Math.max(prog[def.i]||0,stars);saveProg(prog);
    busy=false;showWin(stars);return;
  }
  if(moves<=0){over=true;busy=false;setTimeout(showLose,350);return}
  if(!findMove()){say('S\'ka lëvizje. Po i përziej, se me sa duket na duhet ndihmë.');await shuffle()}
  busy=false;startHint();
}
async function rakiRush(){
  if(moves<=0)return;
  say('Rakia shpërthen! Lëvizjet e mbetura bëhen fishekzjarre. Gëzuar!');
  await sleep(500);
  const ks=[];
  while(moves>0){
    const cand=gemKeys().filter(k=>!at(k).sp&&!ks.includes(k));
    moves--;score+=150;
    if(cand.length&&ks.length<12){const k=pick(cand),t=at(k);t.sp=Math.random()<.5?'row':'col';paint(t);t.el.classList.add('born');ks.push(k);await sleep(120)}
    hud();
  }
  if(ks.length){await blast(new Set(ks),[],2,false);await cascade(null,null,3)}
  let leftover=gemKeys().filter(k=>at(k).sp);
  if(leftover.length){await blast(new Set(leftover),[],3,false);await cascade(null,null,3)}
}
async function shuffle(){
  const ks=gemKeys(),tiles=ks.map(k=>at(k));let g=0;
  do{for(let i=tiles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tiles[i],tiles[j]]=[tiles[j],tiles[i]]}
    ks.forEach((k,i)=>{const[r,c]=rc(k);board[r][c]=tiles[i]});
    if(g++>80)tiles.forEach(t=>{if(!t.sp){t.type=rnd();paint(t)}});
  }while((findRuns().length||!findMove())&&g<300);
  layout();await sleep(350);
}

/* HUD */
function goalIcon(g){return g.kind==='collect'?`<span class="g">${TYPES[g.t].e}</span>`:g.kind==='rug'?'<span class="g ico-rug"></span>':'<span class="g ico-bunker"></span>'}
function goalsHTML(list,initial){return list.map(g=>{const v=initial?(g.kind==='collect'?g.n:g.left):g.left;return`<span class="chip${!initial&&v<=0?' done':''}">${goalIcon(g)}${!initial&&v<=0?'✓':v}</span>`}).join('')}
function hud(){
  $('moves').textContent=moves;$('moves').classList.toggle('low',moves<=5);
  $('score').textContent=score.toLocaleString('sq');
  $('bar').style.width=Math.min(100,score/def.s3*100)+'%';
  $('s2').style.left=(def.s2/def.s3*100)+'%';
  $('s2').classList.toggle('on',score>=def.s2);$('s3').classList.toggle('on',score>=def.s3);
  $('goals').innerHTML=goalsHTML(goals,false);
}
function say(t){$('quip').textContent=t}
function clearSel(){if(sel!==null){const t=at(sel);if(t&&t.el)t.el.classList.remove('sel')}sel=null}
function stopHint(){clearTimeout(hintT);boardEl.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'))}
function startHint(){stopHint();hintT=setTimeout(()=>{if(busy||over||!playing)return;const m=findMove();if(m){m.forEach(k=>at(k).el.classList.add('hint'));say(pick(IDLE))}},8000)}

/* input */
let down=null;
function cellFrom(e){const r=boardEl.getBoundingClientRect();const c=Math.floor((e.clientX-r.left)/cell),rr=Math.floor((e.clientY-r.top)/cell);return inb(rr,c)?{r:rr,c,x:e.clientX,y:e.clientY}:null}
boardEl.addEventListener('pointerdown',e=>{if(busy||over)return;const d=cellFrom(e);if(!d||!isGem(board[d.r][d.c]))return;down=d;try{boardEl.setPointerCapture(e.pointerId)}catch(_){}});
boardEl.addEventListener('pointermove',e=>{
  if(!down||busy)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<cell*.35)return;
  let r2=down.r,c2=down.c;if(Math.abs(dx)>Math.abs(dy))c2+=Math.sign(dx);else r2+=Math.sign(dy);
  const a=key(down.r,down.c);down=null;if(inb(r2,c2))trySwap(a,key(r2,c2));
});
boardEl.addEventListener('pointerup',()=>{
  if(!down||busy){down=null;return}
  const k=key(down.r,down.c);down=null;
  if(sel===null){sel=k;at(k).el.classList.add('sel');return}
  const[r1,c1]=rc(sel),[r2,c2]=rc(k);
  if(Math.abs(r1-r2)+Math.abs(c1-c2)===1){const s=sel;trySwap(s,k)}
  else{clearSel();if(r1!==r2||c1!==c2){sel=k;at(k).el.classList.add('sel')}}
});
boardEl.addEventListener('pointercancel',()=>{down=null});

/* screens */
function showScreen(id){$('mapScreen').hidden=id!=='map';$('gameScreen').hidden=id!=='game'}
function card(html,actions){
  $('card').innerHTML=html;
  actions.forEach(([label,fn,cls])=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;$('card').appendChild(b)});
  $('overlay').hidden=false;const f=$('card').querySelector('button');if(f)f.focus({preventScroll:true});
}
const closeCard=()=>{$('overlay').hidden=true};
function tipFor(i){
  if(i===2)return['<span class="g ico-rug"></span>','Qilimi i gjyshes ka pluhur. Bëj treshe mbi pllakat e qilimit për ta shkundur.'];
  if(i===5)return['<span class="g ico-bunker"></span>','Shqipëria ndërtoi mbi 170 mijë bunkerë. Ja edhe disa. Bëj treshe ngjitur me ta për t\'i shembur. Ata nuk lëvizin.'];
  if(i===11)return['<span class="g ico-rug" style="box-shadow:inset 0 0 0 3px #e5a412"></span>','Qilimat me buzë ari kanë pluhur dyfish. Duan dy treshe secili.'];
  if(i===15)return['<span class="g ico-bunker" style="background:linear-gradient(#8f8a83,#55514b)"></span>','Bunkerët e errët janë të përforcuar. Duan dy goditje. Dikush s\'u besonte fare fqinjëve.'];
  return null;
}
function goalText(d){return d.goals.map(g=>g.kind==='collect'?`${TYPES[g.t].verb.toLowerCase()} ${g.n} ${TYPES[g.t].name}`:g.kind==='rug'?'pastro çdo qilim':'shemb çdo bunker').join(', ')}
function countCells(d,kind){let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=d.bunk&&d.bunk.fn(r,c);if(kind==='bunker'?b:(d.rug&&d.rug.fn(r,c)&&!b))n++}return n}
function openLevel(i){
  const d=levelDef(i),tip=tipFor(i),ep=EPISODES[d.ep];
  const preview=d.goals.map(g=>g.kind==='collect'?{...g,left:g.n}:{...g,left:countCells(d,g.kind)});
  card(`<span class="ep">${ep.name} · Niveli ${i+1}</span><h2>${d.moves} lëvizje</h2>
    <div class="goals">${goalsHTML(preview,true)}</div>
    <p>Detyra: ${goalText(d)}.</p>
    ${tip?`<div class="tip">${tip[0]}<span>${tip[1]}</span></div>`:''}`,
    [['Luaj',()=>startLevel(i)],['Kthehu te harta',closeCard,'ghost']]);
}
function startLevel(i){
  def=levelDef(i);score=0;moves=def.moves;over=false;busy=false;sel=null;playing=true;stopHint();
  closeCard();showScreen('game');
  $('lvlLabel').textContent=EPISODES[def.ep].name+' · Niveli '+(i+1);
  board=[];
  goals=def.goals.map(g=>({...g,left:g.kind==='collect'?g.n:0}));
  hud();size();
  fillBoard();
  goals.forEach(g=>{if(g.kind==='rug')g.left=rugsLeft();if(g.kind==='bunker')g.left=bunkersLeft()});
  hud();
  say(i===0?'Rrëshqit një pllakë drejt fqinjit për t\'i ndërruar. Bashko tre të njëjta. Mos e turpëro shqiponjën.':EPISODES[def.ep].desc);
  startHint();
}
function toMap(){if(busy)return;playing=false;stopHint();closeCard();showScreen('map');renderMap()}
$('backBtn').onclick=toMap;
function showWin(stars){
  const last=def.i===TOTAL-1,s='★'.repeat(stars);
  card(`<span class="ep">${EPISODES[def.ep].name} · Niveli ${def.i+1}</span><div class="bigstars">${[...s].map(x=>`<i>${x}</i>`).join('')}${'★'.repeat(3-stars)}</div>
    <h2>${last?'Të 30 u kaluan':'Niveli u kalua'}</h2><p>${last?'Orikut i mbaruan nivelet dhe tani të ka pak frikë.':pick(WIN)}</p><p>${score.toLocaleString('sq')} lekë</p>`,
    last?[['Kthehu te harta',toMap]]:[['Niveli tjetër',()=>openLevel(def.i+1)],['Harta',toMap,'ghost']]);
}
function showLose(){
  const g=goals.find(g=>g.left>0);
  const why=!g?'':g.kind==='collect'?`Të mungojnë edhe ${g.left} ${TYPES[g.t].name}.`:g.kind==='rug'?`Kanë mbetur ${g.left} pllaka qilimi me pluhur.`:`${g.left} bunkerë ende në këmbë.`;
  card(`<div class="big">💀</div><h2>Mbaruan lëvizjet</h2><p>${pick(LOSE)}</p><p>${why}</p><p style="font-size:.85rem">Jetë pa fund. Nuk jemi përbindësha.</p>`,
    [['Provo përsëri',()=>startLevel(def.i)],['Harta',toMap,'ghost']]);
}

/* map */
function renderMap(){
  const BAND=520,TOP=20,H=EPISODES.length*BAND+TOP,u=unlocked(),m=$('map');
  m.style.height=H+'px';m.innerHTML='';
  EPISODES.forEach((ep,e)=>{const b=document.createElement('div');b.className='band';
    b.style.top=(H-(e+1)*BAND)+'px';b.style.height=(BAND-12)+'px';
    b.style.background=`linear-gradient(180deg,${ep.tint},${ep.tint}aa)`;
    b.innerHTML=`<h3>${ep.name}</h3><p>${ep.desc}</p>`;m.appendChild(b)});
  const pts=[];
  for(let i=0;i<TOTAL;i++){const e=Math.floor(i/5),j=i%5;pts.push({x:50+Math.sin(i*1.25)*30,y:H-e*BAND-70-j*84})}
  const d=(n)=>pts.slice(0,n).map((p,i)=>i?`C ${pts[i-1].x} ${pts[i-1].y-40} ${p.x} ${p.y+40} ${p.x} ${p.y}`:`M ${p.x} ${p.y}`).join(' ');
  m.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="height:${H}px">
    <path d="${d(TOTAL)}" fill="none" stroke="#d6202f55" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <path d="${d(Math.min(u+1,TOTAL))}" fill="none" stroke="#d6202f" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`);
  let total=0;
  pts.forEach((p,i)=>{
    const s=prog[i]||0;total+=s;
    const n=document.createElement('button');n.className='node'+(i<u?' done':i===u?' current':' locked');
    n.style.left=p.x+'%';n.style.top=p.y+'px';n.textContent=i+1;n.setAttribute('aria-label','Niveli '+(i+1)+(i>u?' (i kyçur)':''));
    if(i<u)n.insertAdjacentHTML('beforeend',`<span class="st">${'<i>★</i>'.repeat(s)}${'★'.repeat(3-s)}</span>`);
    if(i===u)n.insertAdjacentHTML('beforeend','<span class="marker">ORIKU KËTU</span>');
    if(i<=u)n.onclick=()=>openLevel(i);else n.disabled=true;
    m.appendChild(n);
  });
  $('totStars').textContent=`★ ${total} / ${TOTAL*3}`;
  const cur=pts[Math.min(u,TOTAL-1)],sc=$('mapScroll');
  requestAnimationFrame(()=>{sc.scrollTop=cur.y-sc.clientHeight/2});
}

window.addEventListener('resize',()=>{if(!busy&&playing)size()});
window.__orik={allMoves:()=>{const out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(!inb(r2,c2))continue;const A=board[r][c],B=board[r2][c2];if(!isGem(A)||!isGem(B))continue;const a=key(r,c),b=key(r2,c2);if(A.sp&&B.sp||A.sp==='bomb'||B.sp==='bomb'){out.push([a,b,99]);continue}swapCells(a,b);const runs=findRuns();swapCells(a,b);if(!runs.length)continue;let sc=0;runs.forEach(run=>{sc+=run.cells.length*2;run.cells.forEach(k=>{const[y,x]=rc(k);sc+=rug[y][x]*3;D4.forEach(([p,q])=>{if(inb(y+p,x+q)&&board[y+p][x+q]&&board[y+p][x+q].kind==='bunker')sc+=4});goals.forEach(g=>{if(g.kind==='collect'&&g.left>0&&typeAt(y,x)===g.t)sc+=2})})});out.push([a,b,sc])}return out},findMove,trySwap,state:()=>({busy,over,moves,score,goals,playing}),startLevel};
renderMap();
if(!prog.length)card(`<div class="big">🦅</div><h2>Candy Orik</h2><p>Rrëshqit ose prek dy pllaka fqinje për t'i ndërruar. Bashko tre të njëjta.</p>
  <div class="legend"><span class="m r"></span><span>Katër në rresht: pllaka me vija pastron një rresht të tërë</span>
  <span class="m b"></span><span>Formë L ose T: pllaka që shkëlqen shpërthen zonën 3×3</span>
  <span class="m x"></span><span>Pesë në rresht: bomba-shqiponjë zhduk një lloj pllake. Ndërro dy speciale bashkë për diçka edhe më të keqe.</span></div>
  <p>30 nivele nëpër Shqipëri. Oriku do komentojë si luan. Nuk të përkrah.</p>`,[["Fillojmë",()=>{closeCard();openLevel(0)}]]);
})();
</script>
